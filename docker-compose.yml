services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stars_merch_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - stars_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stars_merch_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=StarsMerch
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - APP_KEY=base64:TrXAUf1EjFUle0mEz7u93XBqZsgeaK7zfNeFpxoOItg=
      - PHP_CLI_SERVER_WORKERS=4
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=stars_merch
      - DB_USERNAME=stars_user
      - DB_PASSWORD=stars_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stars_network

  db:
    image: mysql:8.0
    container_name: stars_merch_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: stars_merch
      MYSQL_USER: stars_user
      MYSQL_PASSWORD: stars_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "stars_user", "-pstars_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stars_network

volumes:
  db_data:
    driver: local

networks:
  stars_network:
    driver: bridge
